name = "vanaila-studio-api"
main = "src/index.ts"
compatibility_date = "2025-05-27"
compatibility_flags = ["nodejs_compat"]

[[d1_databases]]
binding = "DB"
database_name = "vanaila-studio"
database_id = "placeholder-replace-after-wrangler-d1-create"

# Set secrets via: wrangler secret put JWT_SECRET
# [vars] — don't put JWT_SECRET here, use wrangler secret

[triggers]
crons = ["0 0 * * *"]
