name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install frontend deps
        run: npm ci

      - name: Frontend typecheck
        run: npx tsc --noEmit

      - name: Frontend build
        run: npm run build

      - name: Install backend deps
        working-directory: api
        run: npm ci

      - name: Backend typecheck
        working-directory: api
        run: npx tsc --noEmit
